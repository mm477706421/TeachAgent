# Use a school-issued TLS certificate and local DNS name. No public CDN required.
server {
    listen 443 ssl;
    server_name teachagent.school.lan;
    ssl_certificate /etc/nginx/certs/teachagent.crt;
    ssl_certificate_key /etc/nginx/certs/teachagent.key;
    client_max_body_size 2048m;
    client_body_timeout 900s;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 900s;
        proxy_request_buffering off;
    }
}
