name: Validate and deploy TeachAgent
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: teachagent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pytest -q
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start local server and run browser checks
        env:
          TEACHAGENT_ADMIN_PASSWORD: Local-CI-only-password-123
          TEACHAGENT_E2E_USERNAME: admin
          TEACHAGENT_E2E_PASSWORD: Local-CI-only-password-123
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          python -m backend.cli create-admin --username admin
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/teachagent.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break || sleep 1; done
          cd frontend
          npm run test:e2e
      - name: Package tested server build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git archive HEAD -o /tmp/teachagent-server.tar
          tar -rf /tmp/teachagent-server.tar frontend/dist
          mkdir -p server-artifact
          gzip -c /tmp/teachagent-server.tar > server-artifact/teachagent-server.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: teachagent-server-${{ github.sha }}
          path: server-artifact/teachagent-server.tar.gz
          retention-days: 7
  build-pages:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build:pages
        working-directory: frontend
        env:
          PAGES_BASE_PATH: /TeachAgent/
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:pages
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: frontend/dist-pages
  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static demo to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  deploy-server:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, build-pages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: http://43.165.169.59:8080/
    concurrency:
      group: teachagent-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: teachagent-server-${{ github.sha }}
          path: server-artifact
      - run: python -m pip install paramiko==4.0.0
      - name: Deploy via SSH and verify port 8080
        env:
          DEPLOY_HOST: ${{ secrets.TEACHAGENT_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.TEACHAGENT_SSH_USER }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.TEACHAGENT_SSH_PRIVATE_KEY }}
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.TEACHAGENT_SSH_HOST_FINGERPRINT }}
        run: python deploy/ssh_release.py
