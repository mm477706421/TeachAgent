name: Validate TeachAgent
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start local server and run browser checks
        env:
          TEACHAGENT_ADMIN_PASSWORD: Local-CI-only-password-123
          TEACHAGENT_E2E_PASSWORD: Local-CI-only-password-123
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          python -m backend.cli create-admin --username e2e-admin
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/teachagent.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break || sleep 1; done
          cd frontend
          npm run test:e2e
